apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  # Same multi-source pattern as democratic-csi-iscsi-app.yaml: the upstream
  # chart from a Helm repo, configured by a values file from this git repo.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "87.19.1"
      helm:
        valueFiles:
          - $values/kubernetes/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/tmanzhe/homelab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships very large CRDs (Prometheus, Alertmanager, etc.) that
      # exceed the annotation size limit kubectl's client-side apply uses.
      - ServerSideApply=true
